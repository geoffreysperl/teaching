  hero__description: I'm a dad, husband, student, educator, storyteller, writer, and podcaster. I teach secondary ELA and ESL. I believe in student-centered learning, where each student's uniqueness is celebrated. Fostering curiosity is essential&mdash;I encourage students to explore, question, and discover. Further, I also emphasize&mdash;especially in the age of generative AI&mdash;how reading and writing remain vital skills for future success.
